[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ttblow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.30.0",
    "aiohttp-socks>=0.11.0",
    "cachetools>=7.1.7",
    "diskcache>=5.6.3",
    "python-dotenv>=1.2.2",
    "yt-dlp==2026.7.4",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.0.0",
    "pytest>=8.0.0",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle (ошибки)
    "W",    # pycodestyle (предупреждения)
    "F",    # Pyflakes (ошибки синтаксиса и неиспользуемые переменные)
    "I",    # isort (автоматическая сортировка импортов)
    "B",    # flake8-bugbear (поиск скрытых багов и антипаттернов)
    "UP",   # pyupgrade (авто-обновление синтаксиса под Python 3.13)
    "SIM",  # flake8-simplify (упрощение сложных if/else и условий)
    "N",    # pep8-naming (проверка именования классов, функций и переменных)
    "PTH",  # flake8-use-pathlib (замена os.path на современный pathlib)
    "PERF", # Perflint (предупреждения о неэффективном коде)
    "RUF", # Внутренние полезные правила самого Ruff
]

ignore = [
    "E501", # Длину строки лучше доверить форматировщику ruff format
    "RUF001", # Ложные срабатывания на русские строки интерфейса
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"] # Вложенные with с моками читаются лучше плоских списков контекстов

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
packages = ["src/ttblow"]

