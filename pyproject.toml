[project]
name = "ttblow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.30.0",
    "aiohttp-socks>=0.11.0",
    "cachetools>=7.1.7",
    "diskcache>=5.6.3",
    "python-dotenv>=1.2.2",
    "yt-dlp==2026.7.4",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.0.0",
    "pytest>=8.0.0",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

